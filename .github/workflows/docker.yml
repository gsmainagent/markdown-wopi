name: docker

# 分两种模式（刻意如此）：
#   pull_request  → 只构建、不推送（没有凭据，也不该产生制品）
#   push(main) / release / workflow_dispatch → 构建并推 ghcr.io
# GHCR 用内置 GITHUB_TOKEN，无需仓库 secret。

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - server.js
      - server-state.cjs
      - collaboration.cjs
      - client/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - server.js
      - server-state.cjs
      - collaboration.cjs
      - client/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 额外打的 tag（留空则只按规则自动打）
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}   # ghcr.io/<owner>/<repo>

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Decide whether to publish
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Build (and optionally push) image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.mode.outputs.push }}
          # provenance=false：只出一个普通 manifest，别带 attestation manifest list。
          # 原因见 RUNBOOK §1：OCI/attestation 形态会丢/绕开 HEALTHCHECK，podman 与老客户端
          # 拉取时最容易踩；本镜像自带 HEALTHCHECK，必须留在镜像配置里。
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull it back and assert HEALTHCHECK survived
        if: steps.mode.outputs.push == 'true'
        run: |
          set -euo pipefail
          ref="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep -m1 ':latest$' || true)"
          [ -n "$ref" ] || ref="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed -n '1p')"
          echo "verifying $ref"
          docker buildx imagetools inspect "$ref" --raw | head -4
          docker pull -q "$ref" >/dev/null
          hc="$(docker image inspect "$ref" --format '{{json .Config.Healthcheck}}')"
          echo "healthcheck: $hc"
          [ "$hc" != '<no value>' ] && [ "$hc" != 'null' ] || { echo 'HEALTHCHECK lost in the published image'; exit 1; }
          uid="$(docker image inspect "$ref" --format '{{.Config.User}}')"
          echo "runs as user: $uid"
          [ -n "$uid" ] || { echo 'published image is not running as a non-root user'; exit 1; }
