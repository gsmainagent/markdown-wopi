# Example only. Copy to your own site file and fill in the YOUR-* placeholders.
# Reverse proxy for the WOPI markdown editor. Two supported topologies; pick ONE.
#
#   A) subpath mount   BASE_URL=https://YOUR-HOST:3443/markdown
#   B) dedicated host  BASE_URL=https://YOUR-EDITOR-DOMAIN
#
# The app now handles both prefix-preserving and prefix-stripping forwarding, so
# the trailing slash on proxy_pass is a style choice, not a correctness trap.
# Verify after any change:
#   curl -s  https://YOUR-HOST:3443/markdown/healthz                          # ok
#   curl -s  https://YOUR-HOST:3443/markdown/hosting/discovery | grep -c '<app '   # 1
#   curl -so /dev/null -w '%{http_code}\n' \
#        https://YOUR-HOST:3443/markdown/static/monaco-editor.html            # 200
# A JSON body {"ok":false} means the request reached the app (its own 404);
# an nginx HTML 404 means the request never left the proxy.

# Connection header must be empty for plain HTTP and "upgrade" for WebSockets;
# /collab is the Yjs channel, so without this map the editor opens but never syncs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wopi_md_editor {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ---- A) subpath mount, served next to an existing site -------------------
server {
    listen 3443 ssl;
    server_name YOUR-HOST;

    # Point these at real files before nginx will even start - `nginx -t` fails
    # with "no \"ssl_certificate\" is defined" otherwise, which is the intended
    # behaviour, not a bug in this example.
    ssl_certificate     /etc/ssl/YOUR-HOST/fullchain.pem;
    ssl_certificate_key /etc/ssl/YOUR-HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The editor keeps a 240s keepalive per session; idle timeouts below that
    # silently drop the collaboration socket and the browser falls back to the
    # read-only "session expired" banner.
    location /markdown/ {
        # trailing slash strips /markdown; drop it to forward the prefix as-is
        proxy_pass http://wopi_md_editor/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Host must stay the *public* authority when the prefix is preserved,
        # because BASE_URL is what the app uses to build urlsrc. Keep both
        # headers if you want the app to be able to derive anything itself.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /markdown;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;   # > 240s client heartbeat
        proxy_buffering off;          # streamed WOPI bodies + low-latency WS
        client_max_body_size 32m;     # documents travel as full-file PUTs
    }

    # ... your existing site (Cloudreve, blog, etc.) keeps its own locations.
}

# ---- B) dedicated host / domain, mounted at the site root ----------------
server {
    listen 443 ssl;
    server_name YOUR-EDITOR-DOMAIN;      # BASE_URL=https://YOUR-EDITOR-DOMAIN

    ssl_certificate     /etc/ssl/YOUR-EDITOR-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/ssl/YOUR-EDITOR-DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://wopi_md_editor;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
        client_max_body_size 32m;
    }
}

# ---- Environment variables the app needs alongside this file -------------
#   BASE_URL=https://YOUR-HOST:3443/markdown    # exactly what the browser types
#   ALLOWED_ORIGINS=https://YOUR-HOST:3443      # origin only; paths are ignored
#
# BASE_URL decides the mount prefix and every urlsrc, so a mismatch shows up as
# an Origin rejection or a 404 on the editor page rather than a config error.
# ALLOWED_ORIGINS must be the site that embeds the iframe (your Cloudreve), not
# this editor's own host, unless they share one origin.
